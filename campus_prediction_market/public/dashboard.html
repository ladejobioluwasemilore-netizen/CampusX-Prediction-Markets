<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#071b14">
<title>My CampusX Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,500,0,0" rel="stylesheet">
<style>
body.dashboard-page{background:#f6f8f4}.dash-topbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #e8eee7;height:76px}.dash-shell{max-width:1320px;margin:auto;padding:28px clamp(12px,3.5vw,44px)}
.dash-market-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.overview-more-markets{display:none;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:14px}.overview-actions{display:flex;justify-content:flex-start;margin-top:14px}.overview-actions button{border:1px solid #dce8da;background:#fff;border-radius:10px;padding:10px 14px;color:#175334;font-weight:800}
.dash-market-card{min-width:0;border:1px solid #e3ebe0;border-radius:16px;background:#fff;padding:16px}.dash-market-card h3{overflow-wrap:anywhere}.dash-market-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.dash-market-actions button{border:0;border-radius:9px;padding:10px;font-weight:800}.dash-market-actions .yes{background:#e7f5e3;color:#1c6934}.dash-market-actions .no{background:#f7ece8;color:#a94e40}
@media(max-width:900px){.dash-market-grid,.overview-more-markets{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:650px){.dash-market-grid,.overview-more-markets{grid-template-columns:1fr}.dash-shell{padding:18px 12px}}
</style>
</head>
<body class="dashboard-page">
<header class="dash-topbar"></header>
<main class="dash-shell">
<section class="dash-view active" id="view-overview">
<h1>Overview</h1>
<div id="overviewMarketsPanel" class="dash-panel">
<h2>Campus markets</h2>
<div id="overviewMarketGrid" class="dash-market-grid"></div>
<div id="overviewMoreMarkets" class="overview-more-markets" hidden></div>
<div class="overview-actions"><button type="button" id="toggleOverviewMarkets" aria-expanded="false">View all markets ↓</button></div>
</div>
</section>
</main>
<div class="toast" id="toast"></div>
<script src="campusx-config.js"></script>
<script type="module" src="campusx-backend.js"></script>
<script src="dashboard.js?v=20261121-market-preview-v2"></script>
</body>
</html>
