
<style>
/* =====================================================
   CAMPUSX — COMPLETE RESPONSIVE MOBILE NAVIGATION PATCH
   ===================================================== */

:root {
  --cx-green: #075b3b;
  --cx-green-dark: #06452f;
  --cx-accent: #a8d65e;
  --cx-nav-bg: #ffffff;
  --cx-border: #e7ece8;
  --cx-text: #26332c;
}

* {
  box-sizing: border-box;
}

html, body {
  width: 100%;
  max-width: 100%;
  overflow-x: hidden;
}

img, svg, canvas, video {
  max-width: 100%;
}

/* Desktop sidebar remains normal */
#sidebar,
.side {
  min-width: 0;
}

/* Prevent content from being squeezed */
.main,
.content,
.workspace,
.page {
  min-width: 0;
  max-width: 100%;
}

.content {
  overflow-x: hidden;
}

button, input, select, textarea {
  font: inherit;
  max-width: 100%;
}

/* Tables can scroll instead of breaking the page */
.table-wrap,
.table-responsive {
  width: 100%;
  overflow-x: auto;
}

/* =====================================================
   MOBILE LAYOUT
   ===================================================== */

@media (max-width: 760px) {

  html, body {
    overflow-x: hidden !important;
  }

  /* Hide desktop sidebar branding and footer */
  #sidebar .brand,
  #sidebar .logo,
  #sidebar .sidebottom,
  #sidebar .sidebar-footer,
  #sidebar .sidebar-bottom,
  .side .brand,
  .side .logo {
    display: none !important;
  }

  /* Turn sidebar into a bottom navigation dock */
  #sidebar,
  .side {
    position: fixed !important;
    left: 0 !important;
    right: 0 !important;
    top: auto !important;
    bottom: 0 !important;
    width: 100% !important;
    height: 68px !important;
    min-height: 68px !important;
    max-height: 68px !important;
    z-index: 9999 !important;
    display: flex !important;
    flex-direction: row !important;
    align-items: center !important;
    justify-content: space-around !important;
    gap: 0 !important;
    padding: 5px 4px calc(5px + env(safe-area-inset-bottom)) !important;
    margin: 0 !important;
    background: var(--cx-nav-bg) !important;
    border-top: 1px solid var(--cx-border) !important;
    border-right: 0 !important;
    border-radius: 0 !important;
    box-shadow: 0 -5px 22px rgba(0,0,0,.07) !important;
    overflow: visible !important;
    transform: none !important;
  }

  /* Make all nav groups share the bottom dock */
  #sidebar #nav,
  #sidebar #adminNav,
  #sidebar .nav,
  .side #nav,
  .side #adminNav,
  .side .nav {
    display: contents !important;
  }

  /* Navigation buttons */
  #sidebar .nav button,
  #sidebar .nav a,
  .side .nav button,
  .side .nav a {
    flex: 1 1 0 !important;
    min-width: 0 !important;
    max-width: 82px !important;
    height: 56px !important;
    min-height: 56px !important;
    padding: 8px 2px !important;
    margin: 0 !important;
    display: flex !important;
    flex-direction: column !important;
    align-items: center !important;
    justify-content: center !important;
    gap: 0 !important;
    border: 0 !important;
    border-radius: 10px !important;
    background: transparent !important;
    color: #84918a !important;
    font-size: 0 !important;
    line-height: 1 !important;
    text-align: center !important;
    white-space: nowrap !important;
    overflow: hidden !important;
  }

  /* Hide navigation text labels */
  #sidebar .nav button span,
  #sidebar .nav a span,
  .side .nav button span,
  .side .nav a span {
    display: none !important;
  }

  /* Keep icons visible and consistent */
  #sidebar .nav button svg,
  #sidebar .nav a svg,
  .side .nav button svg,
  .side .nav a svg,
  #sidebar .nav button i,
  #sidebar .nav a i,
  .side .nav button i,
  .side .nav a i {
    display: block !important;
    width: 22px !important;
    height: 22px !important;
    min-width: 22px !important;
    min-height: 22px !important;
    font-size: 22px !important;
    margin: 0 auto !important;
    stroke-width: 1.8 !important;
  }

  /* Active navigation item */
  #sidebar .nav button.active,
  #sidebar .nav a.active,
  .side .nav button.active,
  .side .nav a.active {
    color: var(--cx-green) !important;
    background: rgba(7, 91, 59, .09) !important;
  }

  #sidebar .nav button.active svg,
  #sidebar .nav a.active svg,
  .side .nav button.active svg,
  .side .nav a.active svg {
    stroke-width: 2.4 !important;
  }

  /* Hide desktop menu button */
  #menuBtn,
  .menu-toggle,
  .hamburger,
  #menuToggle {
    display: none !important;
  }

  /* Main content takes full width */
  .main {
    width: 100% !important;
    max-width: 100% !important;
    margin: 0 !important;
    padding: 0 !important;
    min-height: 100vh !important;
  }

  .topbar {
    width: 100% !important;
    min-height: 58px !important;
    padding: 10px 14px !important;
    gap: 8px !important;
  }

  .content {
    width: 100% !important;
    padding: 14px 12px 95px !important;
    margin: 0 !important;
  }

  .page {
    width: 100% !important;
    max-width: 100% !important;
  }

  /* Responsive grids */
  .grid,
  .stats-grid,
  .market-grid,
  .dashboard-grid,
  .cards-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
    gap: 10px !important;
  }

  /* Smaller cards */
  .card,
  .stat-card,
  .market-card,
  .panel {
    min-width: 0 !important;
    padding: 13px !important;
    border-radius: 13px !important;
  }

  /* Prevent oversized text */
  h1 {
    font-size: clamp(21px, 6vw, 28px) !important;
  }

  h2 {
    font-size: 19px !important;
  }

  h3 {
    font-size: 16px !important;
  }

  p, label, small {
    overflow-wrap: anywhere;
  }

  /* Forms */
  input, select, textarea {
    width: 100% !important;
    min-width: 0 !important;
    font-size: 14px !important;
  }

  /* Buttons */
  button {
    max-width: 100%;
  }

  /* Modal sizing */
  .modal,
  .modal-content,
  .dialog {
    width: calc(100% - 24px) !important;
    max-width: 480px !important;
    max-height: 85vh !important;
    overflow-y: auto !important;
    margin: auto !important;
  }

  /* Admin pages */
  .admin-grid,
  .admin-stats {
    grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
  }

  /* Wallet and market layouts */
  .wallet-grid,
  .market-layout,
  .profile-grid {
    grid-template-columns: minmax(0, 1fr) !important;
  }

  /* Horizontal scrolling for wide content */
  .table-wrap,
  .table-responsive,
  table {
    max-width: 100% !important;
  }

  /* Keep notification and profile controls compact */
  .topbar button,
  .topbar .icon-btn {
    flex-shrink: 0;
  }
}

/* Very small phones */
@media (max-width: 380px) {
  #sidebar,
  .side {
    height: 64px !important;
    min-height: 64px !important;
  }

  #sidebar .nav button svg,
  #sidebar .nav a svg,
  .side .nav button svg,
  .side .nav a svg {
    width: 20px !important;
    height: 20px !important;
  }

  .content {
    padding-left: 10px !important;
    padding-right: 10px !important;
  }

  .grid,
  .stats-grid,
  .market-grid,
  .dashboard-grid,
  .cards-grid {
    grid-template-columns: minmax(0, 1fr) !important;
  }
}
</style>

<script>
/* =====================================================
   CAMPUSX — MOBILE NAVIGATION & RESPONSIVENESS
   Keeps existing page navigation event handlers.
   ===================================================== */

(function () {
  "use strict";

  function initCampusXMobile() {
    const sidebar = document.getElementById("sidebar");
    const side = sidebar || document.querySelector(".side");

    if (!side) return;

    const navItems = side.querySelectorAll(
      ".nav button, .nav a, [data-page]"
    );

    /* Add accessible labels without changing navigation */
    navItems.forEach(function (item) {
      const text = (
        item.innerText ||
        item.textContent ||
        item.getAttribute("aria-label") ||
        ""
      ).trim();

      if (text && !item.getAttribute("aria-label")) {
        item.setAttribute("aria-label", text);
      }

      item.setAttribute("title", text || "Navigation");
    });

    /* Close an open mobile sidebar after selecting a page.
       Does not replace or duplicate the existing page handlers. */
    side.addEventListener("click", function (event) {
      const item = event.target.closest(
        ".nav button, .nav a, [data-page]"
      );

      if (!item) return;

      if (window.innerWidth <= 760) {
        side.classList.remove("open");
      }
    });

    /* Close mobile sidebar when Escape is pressed */
    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape") {
        side.classList.remove("open");
      }
    });

    /* Ensure desktop/mobile layout updates correctly */
    window.addEventListener("resize", function () {
      if (window.innerWidth > 760) {
        side.classList.remove("open");
      }
    });

    /* Mark current page active when navigation changes */
    function updateActiveNavigation() {
      const activePage = document.querySelector(".page.active");

      if (!activePage) return;

      const pageId = activePage.id.replace("page-", "");

      side.querySelectorAll("[data-page]").forEach(function (item) {
        item.classList.toggle(
          "active",
          item.dataset.page === pageId
        );
      });
    }

    updateActiveNavigation();

    /* Observe page changes without interfering with navigation */
    const pageObserver = new MutationObserver(function () {
      updateActiveNavigation();
    });

    document.querySelectorAll(".page").forEach(function (page) {
      pageObserver.observe(page, {
        attributes: true,
        attributeFilter: ["class"]
      });
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener(
      "DOMContentLoaded",
      initCampusXMobile,
      { once: true }
    );
  } else {
    initCampusXMobile();
  }
})();
</script>
